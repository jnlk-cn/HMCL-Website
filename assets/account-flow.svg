<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title description">
  <title id="title">Microsoft account verification before every game launch</title>
  <desc id="description">Sign in with Microsoft, verify the Java Edition entitlement and matching Minecraft profile, then start Minecraft. A failed required check stops the launch.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m1 1 4 3-4 3" fill="none" stroke="#818bb9" stroke-width="1.5"/></marker></defs>
  <rect width="1120" height="360" fill="#f6f7fc"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="32" y="42" fill="#505bb5" font-size="13" letter-spacing="2" font-weight="600">BEFORE EVERY GAME LAUNCH</text>
    <g fill="#fff" stroke="#d9deee"><rect x="32" y="80" width="328" height="164" rx="12"/><rect x="396" y="80" width="328" height="164" rx="12"/><rect x="760" y="80" width="328" height="164" rx="12"/></g>
    <g fill="none" stroke="#818bb9" stroke-width="2" marker-end="url(#arrow)"><path d="M367 162h21"/><path d="M731 162h21"/></g>
    <g fill="#505bb5" font-size="13" font-weight="600"><text x="56" y="115">01 / SIGN IN</text><text x="420" y="115">02 / VERIFY</text><text x="784" y="115">03 / PLAY</text></g>
    <g fill="#202434" font-size="24" font-weight="600"><text x="56" y="158">Microsoft account</text><text x="420" y="158">Java Edition ownership</text><text x="784" y="158">Launch Minecraft</text></g>
    <g fill="#606677" font-size="16"><text x="56" y="195">Official OAuth sign-in</text><text x="56" y="219">Xbox / XSTS authentication</text><text x="420" y="195">Current game entitlement</text><text x="420" y="219">Matching Minecraft profile</text><text x="784" y="195">All required checks passed</text><text x="784" y="219">Then start the game process</text></g>
    <circle cx="40" cy="294" r="5" fill="#505bb5"/><text x="58" y="300" fill="#606677" font-size="16">Every launch repeats these checks. Cached profile metadata cannot replace verification.</text>
    <text x="32" y="332" fill="#606677" font-size="14">A failed or unavailable required check stops the launch.</text>
  </g>
</svg>
